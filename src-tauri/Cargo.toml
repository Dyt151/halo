[package]
name = "halo"
version = "0.1.0"
description = "Halo — an open-source, extensible clipboard manager"
authors = ["Halo contributors"]
edition = "2021"
rust-version = "1.77"
# 存在 src/main.rs 与 src/bin/halo_import.rs 两个二进制，显式指定主二进制，
# 否则 tauri build 无法推断。
default-run = "halo"

[lib]
name = "halo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# 菜单栏（状态栏）图标需要 tray-icon feature；image-png 用于内嵌模板图解码。
tauri = { version = "2", features = ["protocol-asset", "image-png", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
# 单实例：剪贴板工具被启动两次会双份监控、双份写库（评审 S8）。
tauri-plugin-single-instance = "2"
# 窗口位置/尺寸持久化（评审 S9）。
tauri-plugin-window-state = "2"
# 真实毛玻璃：把 NSVisualEffectView 垫到 webview 之下（评审 M3）。
window-vibrancy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "io-util",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
arboard = "3"
enigo = "0.2"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
chacha20poly1305 = "0.10"
argon2 = "0.5"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
semver = { version = "1", features = ["serde"] }
async-trait = "0.1"
base64 = "0.22"
# 格式转换：图片编解码（png/jpg/webp/gif/bmp/tiff 互转；heic 走系统 sips 引擎）。
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = "0.2"
# 面板的全屏 Space 宿主（NSPanel）需要 CGRect 参与 msg_send。
objc2-foundation = { version = "0.2", features = ["NSGeometry", "NSAutoreleasePool"] }
# 状态栏面板：getifaddrs 取 IP、dlopen/dlsym 按需加载 CoreWLAN / IOBluetooth。
libc = "0.2"
# 菜单栏图标改用 CoreGraphics 直接描边与排版，才能照搬 Status Trio 的矢量常数
# 与 SF Pro Rounded 数字（纯 CPU 光栅器画不出圆体字，字形一直不对）。
core-graphics = "0.25"
core-text = "22"
core-foundation = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
